# Builds the demo site (including the demo/xr.html landing page and the
# demo/xr-gallery.html viewer) and publishes it to GitHub Pages. WebXR needs
# a secure context, which Pages' HTTPS provides.

name: Deploy demo site to GitHub Pages

on:
  push:
    branches: [xr/main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - id: pages
        uses: actions/configure-pages@v6
      - run: npm ci
      - run: npx vite build --config vite.config.js
        env:
          GITHUB_PAGES_BASE: ${{ steps.pages.outputs.base_path }}/
      # The landing page is served at the site root itself, not through a
      # redirect, so link previews of the root find its Open Graph tags. Its
      # asset URLs are all absolute, so the copy works from either path.
      # The social card goes at the fixed address those tags point to.
      - name: Serve the landing page at the site root, with its social card
        run: |
          cp dist/demo/xr.html dist/index.html
          cp demo/xr-landing/og-image.jpg dist/og-image.jpg
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
