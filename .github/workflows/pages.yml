# Builds the demo site (including the demo/xr.html landing page and the
# demo/xr-gallery.html viewer) and publishes it to GitHub Pages. WebXR needs
# a secure context, which Pages' HTTPS provides.

name: Deploy demo site to GitHub Pages

on:
  push:
    branches: [xr/main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - id: pages
        uses: actions/configure-pages@v6
      - run: npm ci
      - run: npx vite build --config vite.config.js
        env:
          GITHUB_PAGES_BASE: ${{ steps.pages.outputs.base_path }}/
      - name: Point the site root at the XR landing page
        run: >
          printf '<!DOCTYPE html><meta charset="utf-8"><title>Mirador XR</title>
          <meta http-equiv="refresh" content="0; url=demo/xr.html">
          <a href="demo/xr.html">Mirador XR</a>\n' > dist/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
